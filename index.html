    .product-card {

    }

    .toast.show {

    function productImage(article, url) {
      const photo = article.querySelector(".product-photo");

      if (url && /^https:\/\//.test(url)) {
        photo.src = url;
        photo.alt = "Imagem do produto";
        photo.classList.remove("hidden");
        icon.classList.add("hidden");

    function renderMetrics() {
      const revenue = products.reduce((sum, product) => sum + Number(product.price) * Number(product.sold_quantity || 0), 0);
      const cost = products.reduce((sum, product) => sum + Number(product.cost) * Number(product.stock), 0);
      const stock = products.reduce((sum, product) => sum + Number(product.stock), 0);
      const units = products.reduce((sum, product) => sum + Number(product.sold_quantity || 0), 0);

      el("metric-revenue").textContent = money(revenue);
      el("metric-cost").textContent = money(cost);
      el("metric-stock").textContent = stock;
      el("metric-units").textContent = units;
      el("inventory-count").textContent = products.length + (products.length === 1 ? " ITEM" : " ITENS");
    }

    function renderStore() {
      const list = el("store-products");
      const query = el("product-search").value.toLowerCase().trim();
      const category = el("category-filter").value;

      const filtered = products.filter(product =>
        product.status !== "inativo" &&
        (category === "all" || product.category === category) &&
        (product.name.toLowerCase().includes(query) || product.description.toLowerCase().includes(query))
      );

      list.replaceChildren();

      filtered.forEach(product => {
        const fragment = el("store-product-template").content.cloneNode(true);

        article.querySelector(".product-name").textContent = product.name;

        article.querySelector(".product-price").textContent = money(product.price);
        article.querySelector(".product-category").textContent = product.category;

        const stock = article.querySelector(".product-stock");
        const available = Number(product.stock) > 0;
        stock.textContent = available ? Number(product.stock) + " disponível" : "Indisponível";
        stock.className = "product-stock text-xs font-bold " + (available ? "text-emerald-700" : "text-red-600");

        const order = article.querySelector(".order-button");
        order.disabled = !available;
        if (!available) {
          order.textContent = "Produto indisponível";
          order.classList.remove("bg-[#f4d35e]", "hover:bg-[#e3bb3e]");
          order.classList.add("bg-stone-200", "text-stone-500", "cursor-not-allowed");
        }

        order.addEventListener("click", () => {
          openWhatsApp("Olá, Galego Cell! Tenho interesse no produto *" + product.name + "* (" + money(product.price) + "). Pode me enviar mais informações?");

        productImage(article, product.image_url);
        list.appendChild(fragment);
      });

      el("store-empty").classList.toggle("hidden", filtered.length !== 0);
      lucide.createIcons();
    }
